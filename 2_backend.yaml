apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # 👇 [중요] 아래 주소를 본인의 ECR 주소로 수정하세요! (뒤에 :v1 꼭 붙이기)
        image: [내_ECR_주소]:v1
        args:
        - "-text=Hello! Backend Server is OK."
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 5678
  type: ClusterIP
